name: EA1 - Ejecución automática completa

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-ea1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: 1. Obtener proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: 4. Verificar sintaxis de las clases
        run: |
          python -m py_compile hf_dataset_loader.py dataset_summarizer.py

      - name: 5. Probar carga real desde Hugging Face
        run: |
          python - <<'PY'
          import pandas as pd
          from hf_dataset_loader import HFDatasetLoader

          cargador = HFDatasetLoader(
              dataset_id="mstz/heart_failure",
              config_name="death",
              split="train",
          )

          dataframe = cargador.cargar()

          assert isinstance(dataframe, pd.DataFrame)
          assert dataframe.shape == (299, 13)
          assert int(dataframe.isna().sum().sum()) == 0

          print("=" * 60)
          print("HUGGING FACE: OK")
          print("Tipo: pandas.DataFrame")
          print("Filas originales: 299")
          print("Columnas originales: 13")
          print("Valores nulos: 0")
          print("=" * 60)
          PY

      - name: 6. Ejecutar notebook completo
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            PABLO_GOMEZ_EA1_CARGA_DATASET.ipynb \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=600

      - name: 7. Auditar notebook, transformaciones y TXT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook = Path("PABLO_GOMEZ_EA1_CARGA_DATASET.ipynb")
          resumen = Path("resumen_heart_failure.txt")

          assert notebook.exists(), "No existe el notebook."
          assert resumen.exists(), "No existe el archivo TXT."

          nb = json.loads(notebook.read_text(encoding="utf-8"))

          celdas_codigo = [
              celda
              for celda in nb["cells"]
              if celda.get("cell_type") == "code"
          ]

          celdas_ejecutadas = [
              celda
              for celda in celdas_codigo
              if celda.get("execution_count") is not None
          ]

          errores = [
              salida
              for celda in celdas_codigo
              for salida in celda.get("outputs", [])
              if salida.get("output_type") == "error"
          ]

          markdown = "\n".join(
              "".join(celda.get("source", []))
              for celda in nb["cells"]
              if celda.get("cell_type") == "markdown"
          )

          contenido = resumen.read_text(encoding="utf-8")

          assert len(celdas_codigo) > 0
          assert len(celdas_codigo) == len(celdas_ejecutadas)
          assert len(errores) == 0

          # La rúbrica exige al menos cuatro.
          # El proyecto documenta cinco transformaciones.
          assert markdown.lower().count("transformación") >= 5

          assert "Filas: 299" in contenido
          assert "Columnas: 15" in contenido
          assert "Valores nulos totales: 0" in contenido

          print("=" * 60)
          print("AUDITORIA AUTOMATICA EA1: OK")
          print(f"Celdas de codigo: {len(celdas_codigo)}")
          print(f"Celdas ejecutadas: {len(celdas_ejecutadas)}")
          print(f"Errores: {len(errores)}")
          print("Transformaciones documentadas: 5")
          print("DataFrame original: 299 x 13")
          print("DataFrame transformado: 299 x 15")
          print("Archivo TXT: OK")
          print("=" * 60)
          PY

      - name: 8. Crear resumen visible en GitHub Actions
        shell: bash
        run: |
          {
            echo "# ✅ EA1 validada correctamente"
            echo ""
            echo "### Evidencias automáticas"
            echo ""
            echo "- ✅ Repositorio ejecutado en un entorno limpio de GitHub."
            echo "- ✅ Python 3.11 configurado correctamente."
            echo "- ✅ Dependencias instaladas desde requirements.txt."
            echo "- ✅ Clases Python sin errores de sintaxis."
            echo "- ✅ Dataset real descargado desde Hugging Face."
            echo "- ✅ DataFrame original: 299 filas × 13 columnas."
            echo "- ✅ Notebook ejecutado completamente."
            echo "- ✅ Cinco transformaciones verificadas."
            echo "- ✅ DataFrame final: 299 filas × 15 columnas."
            echo "- ✅ resumen_heart_failure.txt generado."
            echo "- ✅ Cero errores de ejecución."
            echo ""
            echo "**Resultado: proyecto reproducible y funcional.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 9. Publicar evidencias de ejecución
        uses: actions/upload-artifact@v4
        with:
          name: EA1-evidencias-ejecucion
          path: |
            PABLO_GOMEZ_EA1_CARGA_DATASET.ipynb
            resumen_heart_failure.txt
          retention-days: 30

      - name: 10. Registrar validación mediante github-actions bot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PABLO_GOMEZ_EA1_CARGA_DATASET.ipynb
          git add resumen_heart_failure.txt

          if git diff --cached --quiet; then
            git commit --allow-empty \
              -m "ci: validacion automatica completa de EA1"
          else
            git commit \
              -m "ci: ejecuta EA1 y actualiza evidencias automaticamente"
          fi

          git push origin HEAD:main